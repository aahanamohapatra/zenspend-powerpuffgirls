    }
    if (isHighValue) {
      activeTriggers.push(`High-Value Threshold Exceeded ($${Math.round(threshold)}+) — Requires buddy pre-approval / cool-down intervention.`);
    }

    if (activeTriggers.length === 0) {

      activeTriggers.push("Night Curfew Active (10 PM – 6 AM) — Triggers low-inhibition friction delay.");
    }

    return {

      explanation: activeTriggers.join(" ")
    };
  }

  const score = 6 + Math.floor(Math.random() * 14); // 6-19

async function runFraudAnalysis(payload) {
  try {
    const user = window.auth ? window.auth.currentUser : null;
    let token = "";
    if (user) {
      token = await user.getIdToken();
    }

    const res = await fetch(FRAUD_API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
      },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error("non-200");
    const data = await res.json();
    if (typeof data.risk_score !== "number" || !data.status || !data.explanation) throw new Error("bad shape");
    return {
      score: Math.round(data.risk_score),
      status: data.status,
      explanation: data.explanation
    };
  } catch (e) {
    return mockFraudResult(payload);
  }
}

let _audioCtx = null;
function getAudioCtx() {
  if (!_audioCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    _audioCtx = new Ctx();
  }
  if (_audioCtx.state === "suspended") _audioCtx.resume();
  return _audioCtx;
}
function playClink(enabled) {
  if (!enabled) return;
  const ctx = getAudioCtx();
  if (!ctx) return;
  const now = ctx.currentTime;
  const osc1 = ctx.createOscillator();
  const gain1 = ctx.createGain();
  osc1.type = "sine";
  osc1.frequency.setValueAtTime(1046.5, now);
  osc1.frequency.exponentialRampToValueAtTime(1568, now + 0.09);
  gain1.gain.setValueAtTime(0.0001, now);
  gain1.gain.exponentialRampToValueAtTime(0.15, now + 0.012);
  gain1.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);
  osc1.connect(gain1).connect(ctx.destination);
  osc1.start(now);
  osc1.stop(now + 0.65);
  const osc2 = ctx.createOscillator();
  const gain2 = ctx.createGain();
  osc2.type = "sine";
  osc2.frequency.setValueAtTime(2093, now);
  gain2.gain.setValueAtTime(0.0001, now);
  gain2.gain.exponentialRampToValueAtTime(0.07, now + 0.012);
  gain2.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
  osc2.connect(gain2).connect(ctx.destination);
  osc2.start(now);
  osc2.stop(now + 0.45);
}
function startBreathingAmbience(enabled) {
  if (!enabled) return () => {};
  const ctx = getAudioCtx();
  if (!ctx) return () => {};
  const bufferSize = Math.floor(ctx.sampleRate * 2);
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.6;
  const noise = ctx.createBufferSource();
  noise.buffer = buffer;
  noise.loop = true;
  const filter = ctx.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.value = 450;
  const gain = ctx.createGain();
  gain.gain.value = 0.02;
  const lfo = ctx.createOscillator();
  lfo.frequency.value = 0.14;
  const lfoGain = ctx.createGain();
  lfoGain.gain.value = 0.022;
  lfo.connect(lfoGain);
  lfoGain.connect(gain.gain);
  noise.connect(filter).connect(gain).connect(ctx.destination);
  noise.start();
  lfo.start();
  const now = ctx.currentTime;
  const bell = ctx.createOscillator();
  const bellGain = ctx.createGain();
  bell.type = "sine";
  bell.frequency.value = 528;
  bellGain.gain.setValueAtTime(0.0001, now);
  bellGain.gain.exponentialRampToValueAtTime(0.06, now + 0.06);
  bellGain.gain.exponentialRampToValueAtTime(0.0001, now + 2.2);
  bell.connect(bellGain).connect(ctx.destination);
  bell.start(now);
  bell.stop(now + 2.3);
  return () => {
    try {
      noise.stop();
      lfo.stop();
    } catch (e) {}
    try {
      noise.disconnect();
      filter.disconnect();
      gain.disconnect();
      lfo.disconnect();
      lfoGain.disconnect();
    } catch (e) {}
  };
}

  }

  let status = "PRICE_STABLE";
  let alt = null;
  let isOutOfStock = false;
  let msg = `Price verified and stable at $${vaulted.toFixed(2)}. Ready for checkout.`;

    currentPrice = 82.50;
    status = "PRICE_DROPPED";
    msg = `Price verified: dropped from $${vaulted.toFixed(2)} to $82.50 (saved $${(vaulted - 82.50).toFixed(2)}) while resting in the Vault.`;
  } else if (norm.includes("watch")) {
    currentPrice = 139.00;
    status = "PRICE_DROPPED";
    msg = `Price dropped by $${(vaulted - 139.00).toFixed(2)} while resting in the Vault.`;
  } else if (norm.includes("keyboard")) {

    status = vaulted < 140 ? "PRICE_INCREASED" : "PRICE_STABLE";
    alt = {
      name: item.name,
      platform: "amazon",
      platform_label: "Amazona",
      price: 132.00,
      savings: Math.max(0, currentPrice - 132.00)
    };
    msg = `Price increased to $${currentPrice.toFixed(2)} on Flipkraft. Alternative available on Amazona for $132.00 (Save $8.00).`;
  } else if (norm.includes("headphones")) {
    currentPrice = 199.00;
    status = "PRICE_STABLE";
    alt = {
      name: item.name,
      platform: "flipkart",
      platform_label: "Flipkraft",
      price: 185.00,
      savings: 14.00

    status,
    product_name: item.name,

}
